[project]
name = "maris"
version = "0.1.0"
description = "Multi-Agent Research Intelligence System — An autonomous research agent for scientific papers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MARIS Developer" }]

dependencies = [
    # --- Core AI/Agent Framework ---
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.4.0",

    # --- Vector Store ---
    "qdrant-client>=1.12.0",

    # --- Embeddings & Search ---
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "langchain-huggingface>=0.1.0",

    # --- PDF & Paper Ingestion ---
    "PyMuPDF>=1.25.0",
    "arxiv>=2.1.0",
    "aiohttp>=3.10.0",

    # --- Data & Storage ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # --- Observability ---
    "langsmith>=0.2.0",

    # --- UI ---
    "streamlit>=1.40.0",

    # --- Utilities ---
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
